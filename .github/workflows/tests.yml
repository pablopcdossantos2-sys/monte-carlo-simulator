name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Rebuild offline bundle
        run: npm run build:offline
      - name: Verify offline bundle is synchronized
        run: git diff --exit-code -- offline.html
      - name: Run tests
        run: npm test
